name: PR 22 — complete browser and offline review
on:
  push:
    branches: [rename-profiles]

permissions:
  contents: read

concurrency:
  group: pr22-browser-verification
  cancel-in-progress: true

jobs:
  full-browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Full Chromium and WebKit E2E suite, including v12 upgrade and GPS verification
        id: e2e
        continue-on-error: true
        run: npm run test:e2e
      - name: Offline smoke
        run: npm run smoke:offline
      - name: Service worker update smoke
        run: npm run smoke:sw-update
      - name: Production CSP gate
        run: npm run security:csp
      - name: Assert complete E2E suite passed
        if: always()
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        run: test "$E2E_OUTCOME" = success
