name: Обновление расписания ДУМ РТ

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Проверить официальный источник
    runs-on: ubuntu-latest
    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Подготовить Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Загрузить полный актуальный год
        run: npm run data:update

      - name: Запустить тесты
        run: npm test

      - name: Проверить типы
        run: npm run typecheck

      - name: Проверить production-сборку
        run: npm run build

      - name: Создать или обновить pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: automation/dum-rt-prayer-times
          delete-branch: true
          commit-message: 'data: update DUM RT prayer times'
          title: 'data: обновить расписание ДУМ РТ'
          body: |
            Автоматическая синхронизация с официальными таблицами ДУМ Республики Татарстан.

            Перед объединением проверьте изменения в `public/data/prayer-times-current.json`.
