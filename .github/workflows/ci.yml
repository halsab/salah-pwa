name: Проверка и публикация

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      app_version:
        description: Версия для production-сборки
        required: false
        type: string
        default: ''
      checkout_ref:
        description: Commit для production-сборки
        required: false
        type: string
        default: ''
      deploy:
        description: Публиковать ли сборку в GitHub Pages
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ inputs.deploy && 'pages-deploy' || format('verify-{0}', github.ref) }}
  cancel-in-progress: ${{ !inputs.deploy }}

jobs:
  verify:
    name: Тесты и production-сборка
    runs-on: ubuntu-latest
    env:
      VITE_APP_VERSION: ${{ inputs.app_version }}
    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Подготовить Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Проверить закрепление GitHub Actions
        run: npm run actions:check

      - name: Проверить номер релизной сборки
        if: inputs.deploy
        run: |
          if [[ ! "$VITE_APP_VERSION" =~ ^v[0-9]{2}\.[1-9][0-9]*$ ]]; then
            echo 'Публикация без версии формата vYY.N запрещена.'
            exit 1
          fi

      - name: Проверить lint
        run: npm run lint

      - name: Запустить модульные тесты
        run: npm test

      - name: Проверить покрытие тестами
        run: npm run test:coverage

      - name: Проверить типы
        run: npm run typecheck

      - name: Собрать production-версию
        run: npm run build

      - name: Проверить бюджеты production-сборки
        run: npm run build:check

      - name: Проверить npm audit
        run: npm run security:audit

      - name: Проверить лицензии зависимостей
        run: npm run license:check

      - name: Установить Chromium для offline smoke-test
        run: npx playwright install --with-deps chromium

      - name: Проверить Content Security Policy
        run: npm run security:csp

      - name: Проверить повторный запуск без сети
        run: npm run smoke:offline

      - name: Проверить обновление service worker
        run: npm run smoke:sw-update

      - name: Настроить GitHub Pages
        if: inputs.deploy
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Загрузить артефакт GitHub Pages
        if: inputs.deploy
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    name: Опубликовать GitHub Pages
    if: inputs.deploy
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
