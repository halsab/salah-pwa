name: Проверки

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_call:
    inputs:
      app_version:
        description: Версия для production-сборки
        required: true
        type: string
      full_quality_gate:
        description: Запустить полный набор проверок перед публикацией
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  verify:
    name: Проверки и production-сборка
    runs-on: ubuntu-latest
    env:
      VITE_APP_VERSION: ${{ inputs.app_version }}
    steps:
      - name: Проверить ветку публикации
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo 'Публикацию можно запускать только из ветки main.'
          exit 1

      - name: Скачать репозиторий
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Подготовить Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Проверить выбранный номер сборки
        if: inputs.full_quality_gate
        run: node scripts/releaseVersion.ts

      - name: Установить зависимости
        run: npm ci

      - name: Определить область изменений
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            schedule)
              echo 'dependencies=true' >> "$GITHUB_OUTPUT"
              echo 'workflows=false' >> "$GITHUB_OUTPUT"
              ;;
            pull_request|push)
              if [ "${{ github.event_name }}" = 'pull_request' ]; then
                base='${{ github.event.pull_request.base.sha }}'
              else
                base='${{ github.event.before }}'
              fi
              if [ -z "$base" ] || [ "$base" = '0000000000000000000000000000000000000000' ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
                base='HEAD~1'
              fi
              if [ "${{ github.event_name }}" = 'pull_request' ]; then
                base="$(git merge-base "$base" HEAD)"
              fi
              git diff --name-only "$base" HEAD > changed-files.txt
              node scripts/detectChanges.ts changed-files.txt >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo 'dependencies=false' >> "$GITHUB_OUTPUT"
              echo 'workflows=false' >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Проверить закрепление GitHub Actions
        if: steps.changes.outputs.workflows == 'true'
        run: npm run actions:check

      - name: Проверить lint
        run: npm run lint

      - name: Запустить модульные тесты
        if: github.event_name != 'schedule'
        run: npm test

      - name: Запустить модульные тесты и проверить покрытие
        if: github.event_name == 'schedule'
        run: npm run test:coverage

      - name: Собрать production-версию
        run: npm run build

      - name: Проверить бюджеты production-сборки
        if: inputs.full_quality_gate
        run: npm run build:check

      - name: Проверить npm audit
        if: steps.changes.outputs.dependencies == 'true'
        run: npm run security:audit

      - name: Проверить лицензии зависимостей
        if: steps.changes.outputs.dependencies == 'true'
        run: npm run license:check

      - name: Установить браузеры Playwright
        if: inputs.full_quality_gate
        run: npx playwright install --with-deps chromium webkit

      - name: Проверить критический браузерный набор
        if: inputs.full_quality_gate
        run: npm run test:e2e

      - name: Загрузить артефакт GitHub Pages
        if: inputs.full_quality_gate
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
