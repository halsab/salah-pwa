name: Проверка и публикация

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Тесты и production-сборка
    runs-on: ubuntu-latest
    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v6

      - name: Подготовить Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Запустить модульные и пользовательские тесты
        run: npm test

      - name: Проверить типы
        run: npm run typecheck

      - name: Собрать production-версию
        run: npm run build

      - name: Установить Chromium для offline smoke-test
        run: npx playwright install --with-deps chromium

      - name: Проверить повторный запуск без сети
        run: npm run smoke:offline

      - name: Настроить GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Загрузить артефакт GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Опубликовать GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v5
