name: Проверка и публикация

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      app_version:
        description: Версия для production-сборки
        required: false
        type: string
        default: ''
      checkout_ref:
        description: Commit для production-сборки
        required: false
        type: string
        default: ''
      deploy:
        description: Публиковать ли сборку в GitHub Pages
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ inputs.deploy && 'pages-deploy' || format('verify-{0}', github.ref) }}
  cancel-in-progress: ${{ !inputs.deploy }}

jobs:
  verify:
    name: Тесты и production-сборка
    runs-on: ubuntu-latest
    env:
      VITE_APP_VERSION: ${{ inputs.app_version }}
    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Подготовить Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Запустить модульные и пользовательские тесты
        run: npm test

      - name: Проверить типы
        run: npm run typecheck

      - name: Собрать production-версию
        run: npm run build

      - name: Установить Chromium для offline smoke-test
        run: npx playwright install --with-deps chromium

      - name: Проверить повторный запуск без сети
        run: npm run smoke:offline

      - name: Настроить GitHub Pages
        if: inputs.deploy
        uses: actions/configure-pages@v6

      - name: Загрузить артефакт GitHub Pages
        if: inputs.deploy
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Опубликовать GitHub Pages
    if: inputs.deploy
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v5
