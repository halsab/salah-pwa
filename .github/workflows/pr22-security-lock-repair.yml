name: PR 22 — repair audited lockfile
on:
  push:
    branches: [rename-profiles]
permissions:
  contents: write
jobs:
  patch-lockfile:
    if: github.event.head_commit.message != 'chore: patch vulnerable transitive dependencies'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fix non-major vulnerable transitives
        run: npm audit fix --package-lock-only --audit-level=high
      - name: Verify reproducible install
        run: npm ci
      - name: Enforce security audit
        run: npm run security:audit
      - name: Check lockfile-only changes
        run: |
          test -z "$(git diff --name-only -- package.json)"
          git diff --check
          git status --short
          test -n "$(git diff --name-only -- package-lock.json)"
      - name: Commit audited lockfile fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m 'chore: patch vulnerable transitive dependencies'
          git push origin HEAD:rename-profiles
