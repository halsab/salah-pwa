    <template id="app-credits">
      <div class="app-credits">

      </div>
    </template>
    <template id="methodology-content">
        <div class="methodology-content">
          <section class="methodology-section">
            <h3>Официальные таблицы</h3>
            <p>
              Для официального источника используется готовое расписание: приложение его не пересчитывает. Сейчас поддерживаются таблицы
              <a href="https://dumrt.ru/ru/help-info/prayertime/" data-primary-source target="_blank" rel="noreferrer">ДУМ РТ</a>.
            </p>
          </section>

          <section class="methodology-section">
            <h3>Расчёт на устройстве</h3>
            <p>
              Время рассчитывается прямо на устройстве библиотекой
              <a href="https://github.com/batoulapps/adhan-js" target="_blank" rel="noreferrer">Adhan JS 4.4.6</a>.
              Для расчёта интернет не нужен.
            </p>
            <p>
              Профиль задаёт углы или интервал Иша: ДУМ РТ — 18°/15°, ДУМ РФ — 16°/15°.
              Аср и правило для северных широт выбираются отдельно. Ручные параметры могут переопределять профиль; эффективные значения указаны в сведениях об источнике.
            </p>
            <p>
              Если сумерек нет, правило ДУМ РТ ставит Фаджр за 120 минут до восхода,
              а Иша — через 90 минут после заката. Другие варианты перечислены здесь:
              <a href="https://github.com/batoulapps/adhan-js/blob/master/METHODS.md" target="_blank" rel="noreferrer">описание профилей</a>.
            </p>
          </section>

          <section class="methodology-section methodology-timezone">
            <h3>Часовой пояс</h3>
            <p>
              Дата и время показываются в часовом поясе выбранного места. Для готового
              расписания ДУМ РТ используется московское время, а для автономного расчёта —
              часовой пояс сохранённого города или геопозиции.
            </p>
          </section>

          <section class="methodology-section">
            <h3>Местоположение</h3>
            <p>
              GPS обрабатывается на устройстве. Справочник городов —
              <a href="https://www.geonames.org/" target="_blank" rel="noreferrer">GeoNames</a>
              (<a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noreferrer">CC BY 4.0</a>).
            </p>
            <p>
              Координаты не отправляются геокодерам. Название-ориентир находится в локальных
              пакетах GeoNames, а территория Татарстана проверяется по локальной границе
              <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">OpenStreetMap</a>
               через geoBoundaries (ODbL). В автоматическом режиме у границы или при недостаточной точности
              используется расчёт. Для GPS внутри подтверждённой территории выбирается
              таблица ближайшего опубликованного пункта, а не отдельная таблица для точки GPS.
            </p>
          </section>

          <p class="methodology-disclaimer">
            Salah — информационное приложение и не представляет ДУМ РТ или другую религиозную организацию. Расчётное время может отличаться от расписания местной мечети. При наличии официального местного расписания рекомендуется руководствоваться им.
          </p>
        </div>
    </template>
    <template id="reset-description">
        <p>Будут удалены место и координаты, часовой пояс, настройки времени, оформление и сохранённые расписания во всех вкладках Salah. Отменить удаление нельзя.</p>
        <p>Оболочка приложения и уже загруженные публичные справочники останутся доступны офлайн. Разрешение браузера на геопозицию не отзывается; Salah не запросит её снова без вашего действия.</p>
    </template>
    <template id="settings-copy-1">При ручном выборе автоматический выбор источника будет отключён.</template>
    <template id="settings-copy-2">Место, координаты, настройки и сохранённые расписания хранятся на этом устройстве.</template>
    <template id="settings-copy-3">Автоматически — рекомендуется. Источник выбирается по месту и дате.</template>
    <template id="settings-copy-4">Сейчас используется официальное расписание. Аср, углы и поправки не меняют опубликованные значения. Применение ручного расчёта сменит источник.</template>
    <template id="advanced-copy-1">Автоматический выбор источника будет отключён. Параметры применятся только после нажатия «Применить ручной расчёт».</template>
    <template id="advanced-copy-2">Пустой угол или поправка использует значение профиля. Аср и поправки действуют только в расчёте; опубликованная таблица не изменяется.</template>
    <template id="advanced-copy-3">Проверьте поля: углы от 1 до 30°, интервал Иша — целое число от 1 до 240 минут, поправки — целые числа от −180 до 180. Незавершённые числа не применяются.</template>
    <template id="source-copy-1">Опубликованные значения показаны без пересчёта. Пункт таблицы может отличаться от выбранного места: для подтверждённого покрытия используется ближайший опубликованный пункт. Утренний намаз в мечетях — время джамаата, а завершение сухура не заменяет начало Фаджра.</template>
    <template id="source-copy-2">Вычислено на устройстве для выбранного места и даты. Интернет для расчёта не нужен. Название профиля обозначает параметры расчёта, а не официальность результата.</template>
    <template id="source-copy-3">Солнечный цикл восстановлен по ближайшей подходящей широте или дню.</template>
    <template id="source-copy-4">Salah — информационное приложение и не представляет ДУМ РТ или другую религиозную организацию. Расчётное время может отличаться от расписания местной мечети. При наличии официального местного расписания рекомендуется руководствоваться им.</template>
    <template id="source-copy-5">Проверка обновлений не удалась. Показана сохранённая таблица.</template>
    <template id="location-copy-1">Для полного поиска нужно загрузить данные. Подключитесь к сети и повторите поиск.</template>
    <template id="location-copy-2">Уточните название города: введите не менее трёх букв или добавьте регион. Показаны крупные города.</template>
    <template id="location-copy-3">Используем сохранённую версию каталога. Обновление пока недоступно.</template>
    <template id="location-copy-4">Точность GPS или близость границы не позволяют подтвердить территорию ДУМ РТ.</template>
    <template id="location-copy-5">Локальные геоданные недоступны; покрытие ДУМ РТ не подтверждено.</template>
    <template id="location-copy-6">Новый выбор города сбрасывает ручную зону. Повторное определение GPS сохраняет её для текущего GPS-места.</template>
    <template id="app-copy-1">Выберите город или определите геопозицию. Источник будет подобран автоматически.</template>
    <template id="app-copy-2">Не удалось открыть расписание. Проверьте соединение и попробуйте ещё раз.</template>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
